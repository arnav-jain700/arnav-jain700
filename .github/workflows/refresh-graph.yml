name: Refresh contribution graph & activity

on:
  schedule:
    - cron: "0 5 * * *" # once a day, 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r tools/requirements-daily.txt

      - run: python tools/pull_contributions.py arnav-jain700 assets/contributions.json

      - run: python tools/render_graph.py assets/contributions.json graph.svg

      - run: python tools/render_panel.py sysinfo.svg

      - run: python tools/render_stats.py

      - run: python tools/pull_activity.py arnav-jain700 README.md

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh contribution graph & activity [skip ci]"
          file_pattern: "assets/contributions.json graph.svg sysinfo.svg stats.svg README.md"
