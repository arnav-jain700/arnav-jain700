    .title { font-family: "Fira Code", monospace, sans-serif; font-size: 11px; fill: #8b949e; font-weight: 600; }
    .label { font-family: "Fira Code", monospace, sans-serif; font-size: 12px; fill: #8b949e; font-weight: 500; }
    .value { font-family: "Fira Code", monospace, sans-serif; font-size: 12px; fill: #e6edf3; font-weight: 500; }
    .prompt { font-family: "Fira Code", monospace, sans-serif; font-size: 12px; fill: #38bdf8; font-weight: 700; }
