<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 232" width="460" height="232">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
    .header-bg { fill: #161b22; rx: 10px; }
    .btn-red { fill: #ff5f56; }
    .btn-yellow { fill: #ffbd2e; }
    .btn-green { fill: #27c93f; }
    .title { font-family: "Fira Code", monospace, sans-serif; font-size: 12px; fill: #8b949e; font-weight: 600; }
    .label { font-family: "Fira Code", monospace, sans-serif; font-size: 13px; fill: #8b949e; font-weight: 500; }
    .value { font-family: "Fira Code", monospace, sans-serif; font-size: 13px; fill: #c9d1d9; font-weight: 400; }
    .prompt { font-family: "Fira Code", monospace, sans-serif; font-size: 13px; fill: #38bdf8; font-weight: 600; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .anim-row { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
  </style>
  <rect width="100%" height="100%" class="bg"/>
  <path d="M 0,10 A 10,10 0 0 1 10,0 L 450,0 A 10,10 0 0 1 460,10 L 460,36 L 0,36 Z" class="header-bg"/>
  <circle cx="20" cy="18" r="6" class="btn-red"/>
  <circle cx="38" cy="18" r="6" class="btn-yellow"/>
  <circle cx="56" cy="18" r="6" class="btn-green"/>
  <text x="230.0" y="22" text-anchor="middle" class="title">arnav-jain700@terminal:~ (sysinfo)</text>
  <g class="anim-row" style="animation-delay: 0.10s;">
    <text x="24" y="66" class="prompt">❯</text>
    <text x="42" y="66" class="label">user:</text>
    <text x="119" y="66" class="value">arnav-jain700</text>
  </g>
  <g class="anim-row" style="animation-delay: 0.25s;">
    <text x="24" y="92" class="prompt">❯</text>
