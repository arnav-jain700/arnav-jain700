    <text x="119" y="144" class="value">Python · JavaScript/TypeScript · React · C++</text>
  </g>
  <g class="anim-row" style="animation-delay: 0.70s;">
    <text x="24" y="170" class="prompt">❯</text>
    <text x="42" y="170" class="label">now:</text>
